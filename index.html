function render(){if(!state){onboarding();return}state.identity=state.identity||{resumeDraft:'',portfolioDraft:''};state.student=state.student||{story:'',course:'',notes:''};layout()}
function percent(){let p=state.profile;let n=(p.interests?.length?1:0)+(p.skills?.length?1:0)+(p.experiences?.length?1:0)+(p.goal?1:0)+(p.education?1:0);return Math.round(35+n*13)}
function scoreOpportunity(o){let p=state.profile, score=46, why=[];let overlap=(o.interests||[]).filter(i=>p.interests.includes(i));if(overlap.length){score+=Math.min(22,overlap.length*10);why.push(`Connects to your interest in ${overlap.slice(0,2).join(' and ')}.`)}if(o.stage.includes(p.stage)){score+=18;why.push(`Designed for ${p.stage.toLowerCase()}s.`)}if(/beginner|no experience|open entry/i.test(o.level)){score+=10;why.push('Welcomes first-time participants.')}if(o.format==='Online'&&(p.format==='Online'||p.format==='Any')){score+=4;why.push('Online format fits your preference.')}return {score:Math.min(score,99),why:why.join(' ')||'A possible path to explore as your profile develops.'}}
function renderPage(){let v=$('#view');if(page==='home')v.innerHTML=homePage();else if(page==='profile')v.innerHTML=profilePage();else if(page==='opportunities')v.innerHTML=opportunitiesPage();else if(page==='zero')v.innerHTML=zeroPage();else if(page==='roadmap')v.innerHTML=roadmapPage();else if(page==='identity')v.innerHTML=identityPage();else if(page==='student')v.innerHTML=studentPage();bindPage()}
function homePage(){let p=state.profile, matches=[...SAMPLE_OPPS].map(o=>({o,...scoreOpportunity(o)})).sort((a,b)=>b.score-a.score).slice(0,3),done=state.roadmap.filter(x=>x.done).length,progress=Math.round(done/state.roadmap.length*100)||0;return `<div class="welcome"><div><h2>Welcome, ${esc(p.name)}</h2><p>A clear next step, built around what matters to you.</p></div><span class="pill">✦ &nbsp;Your path is taking shape</span></div><div class="hero"><div><div class="eyebrow">A good place to begin</div><h3>${p.experiences.length?'Turn what you know into your next opportunity.':'Start small. Make something real.'}</h3><p>${p.interests.length?`Your interests in ${esc(p.interests.slice(0,2).join(' and '))} can become evidence through one focused project.`:'Explore an interest, make something small, and build evidence one step at a time.'}</p></div><button data-goto="roadmap">See your roadmap ↘</button></div><div class="section-head"><h3>Your personal intelligence</h3><span>Based on what you shared · Edit anytime</span></div><div class="grid2"><article class="card"><div class="card-title">Your starting profile <button class="edit" data-goto="profile">Edit profile ↗</button></div><div class="scoreline"><div class="score">${percent()}%</div><div class="scoretext"><b>${percent()>70?'A strong foundation':'A promising foundation'}</b><p>Add details as you go to sharpen matches.</p></div></div><div class="subhead">Interests you chose</div><div class="chips">${chiplist(p.interests)}</div><div class="subhead">Skills you can demonstrate</div><div class="chips">${chiplist(p.skills,'chip evidence')}</div><div class="subhead">Strengths to explore · inferred</div><div class="chips">${chiplist(p.strengths.length?p.strengths:inferStrengths(p.interests),'chip inferred')}</div><div class="legend"><i></i>Shared by you <i class="evidence"></i>Evidence added <i class="inferred"></i>Inferred — confirm or edit</div></article><article class="card"><div class="card-title">Opportunity radar <button class="edit" data-goto="opportunities">See all ↗</button></div>${matches.map(({o,score,why})=>`<div class="opportunity"><div class="opp-top"><b>${esc(o.name)}</b><span class="match">${score}% fit</span></div><div class="org">${esc(o.org)}</div><div class="opp-meta"><span>${esc(o.type)}</span><span>${esc(o.level)}</span></div><p class="why">${esc(why)}</p></div>`).join('')}</article></div><div class="section-head"><h3>Your first 30 days</h3><span>${done}/${state.roadmap.length} milestones complete · ${progress}%</span></div><div class="roadmap">${state.roadmap.slice(0,3).map((x,i)=>`<article class="road-step ${x.done?'complete':''}"><button class="check" data-road="${x.id}" title="Toggle complete">${x.done?'✓':'○'}</button><span class="num">${esc(x.week)}</span><h4>${esc(x.title)}</h4><p>${esc(x.detail)}</p><div class="duration">${esc(x.duration)}</div></article>`).join('')}</div><div class="footer-note">All opportunities are illustrative examples, not confirmed active listings. Verify eligibility, deadlines, and details with each organiser.</div>`}
function inferStrengths(interests){let map={Design:['Visual thinking','Creative problem-solving'],Technology:['Curiosity','Systems thinking'],Business:['Initiative','Strategic thinking'],Research:['Attention to detail','Questioning'], 'Social impact':['Empathy','Community awareness'],Writing:['Clear communication','Reflection'],Science:['Curiosity','Analytical thinking'],Entrepreneurship:['Initiative','Adaptability'],Climate:['Systems thinking','Community awareness'],Health:['Empathy','Curiosity']};return [...new Set(interests.flatMap(i=>map[i]||[]))].slice(0,4)}
function profilePage(){let p=state.profile;return `<div class="pagehead"><div><h2>Personal profile</h2><p>A living picture of your interests, skills, experience, and direction. You control what belongs here.</p></div><button class="secondary" data-action="clearProfile">Reset profile</button></div><div class="pagegrid"><div class="stack"><article class="card"><div class="card-title">About you <button class="edit" data-action="editBasics">Edit details ↗</button></div><div class="subhead">Name & stage</div><p style="font-size:12px">${esc(p.name)} · ${esc(p.stage)}</p><div class="subhead">Current goal</div><p style="font-size:12px">${esc(p.goal||'Add a goal to guide your matches.')}</p><div class="subhead">Location & format</div><p style="font-size:12px">${esc(p.location||'Location not shared')} · ${esc(p.format||'Any format')}</p><div class="subhead">Education</div><p style="font-size:12px">${esc(p.education||'No education details added')}</p></article><article class="card"><div class="card-title">Interests <button class="edit" data-action="editInterests">Edit interests ↗</button></div><div class="chips" style="margin-top:12px">${chiplist(p.interests)}</div></article><article class="card"><div class="card-title">Strengths to explore <span class="status">Inferred from your interests</span></div><p class="hint">These are hypotheses to consider, not proven skills. Confirm one to add it as a self-reported strength.</p><div class="chips" style="margin:10px 0">${chiplist(p.strengths.length?p.strengths:inferStrengths(p.interests),'chip inferred')}</div><button class="secondary" data-action="confirmStrength">Add a strength I recognize</button></article></div><div class="stack"><article class="card"><div class="card-title">Skills with evidence <button class="edit" data-action="addSkill">+ Add skill</button></div><p class="hint">Only skills you add are shown as demonstrated. Add a short example of how you used it.</p>${p.skills.length?p.skills.map((x,i)=>`<div class="itemrow"><div><h4>${esc(x.name)}</h4><p>${esc(x.evidence||'No example attached yet')}</p></div><button class="subtle" data-remove-skill="${i}">Remove</button></div>`).join(''):'<div class="empty">Your skills are yours to define. Add one when ready.</div>'}</article><article class="card"><div class="card-title">Experience, projects & achievements <button class="edit" data-action="addExperience">+ Add evidence</button></div><p class="hint">School projects, volunteering, caring responsibilities, personal work, and paid roles can all demonstrate skills.</p>${p.experiences.length?p.experiences.map((x,i)=>`<div class="itemrow"><div><h4>${esc(x.title)}${x.org?' · '+esc(x.org):''}</h4><p>${esc(x.detail)}${x.date?' · '+esc(x.date):''}</p></div><button class="subtle" data-remove-exp="${i}">Remove</button></div>`).join(''):'<div class="empty">No experience is required to start. Add any relevant project or activity when you have one.</div>'}</article><article class="card"><div class="card-title">Your data</div><p class="hint">This demo stores your profile in local browser storage. Download a copy or clear it from this device.</p><div class="toolrow"><button class="secondary" data-action="exportData">Download profile data</button><button class="subtle" data-action="clearData">Clear all local data</button></div></article></div></div>`}
function opportunitiesPage(){let savedOnly=oppTab==='saved';return `<div class="pagehead"><div><h2>Opportunity radar</h2><p>Explore sample opportunities, understand the fit, and save ones to follow up. Match scores are based on your profile and are explainable.</p></div><span class="pill">${SAMPLE_OPPS.length} sample opportunities</span></div><div class="card"><div class="tabs"><button class="tab ${oppTab==='matches'?'active':''}" data-opptab="matches">For you</button><button class="tab ${savedOnly?'active':''}" data-opptab="saved">Saved (${state.saved.length})</button></div><div class="toolrow"><input id="oppSearch" placeholder="Search opportunities"><select id="oppType"><option value="">All types</option>${[...new Set(SAMPLE_OPPS.map(x=>x.type))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="oppLevel"><option value="">All experience levels</option><option value="beginner">Beginner friendly</option></select><select id="oppFormat"><option value="">Any format</option><option>Online</option><option>Hybrid</option><option>Offline</option></select></div><div class="list" id="oppList" style="margin-top:12px"></div><div class="footer-note">These are illustrative sample records only. No listing is verified active. Check official organiser sources before applying.</div></div>`}
function renderOpps(){let list=$('#oppList');if(!list)return;let search=($('#oppSearch')?.value||'').toLowerCase(),type=$('#oppType')?.value||'',level=$('#oppLevel')?.value||'',format=$('#oppFormat')?.value||'';let data=SAMPLE_OPPS.filter(o=>oppTab==='saved'?state.saved.includes(o.id):o.stage.includes(state.profile.stage)).filter(o=>!search||`${o.name} ${o.description} ${o.type} ${o.interests.join(' ')}`.toLowerCase().includes(search)).filter(o=>!type||o.type===type).filter(o=>!level||/beginner|no experience|open entry/i.test(o.level)).filter(o=>!format||o.format===format).map(o=>({o,...scoreOpportunity(o)})).sort((a,b)=>b.score-a.score);list.innerHTML=data.length?data.map(({o,score,why})=>`<article class="opcard"><div class="opcardhead"><div><h4>${esc(o.name)}</h4><div class="org">${esc(o.org)}</div></div><span class="match">${score}% fit</span></div><div class="opp-meta"><span>${esc(o.type)}</span><span>${esc(o.level)}</span><span>${esc(o.format)}</span><span>${esc(o.location)}</span><span>For: ${esc(o.stage.join(', '))}</span><span>${esc(o.deadline)}</span></div><p>${esc(o.description)}</p><p class="explain"><b>Why this may fit:</b> ${esc(why)}</p><div class="op-actions"><button class="${state.saved.includes(o.id)?'secondary':'subtle'}" data-save="${o.id}">${state.saved.includes(o.id)?'★ Saved':'☆ Save'}</button><span class="status">${esc(o.source)}</span></div></article>`).join(''):'<div class="empty">No opportunities match these filters. Try broadening your search, or explore your interests in the Zero to Potential pathway.</div>'}
function zeroPage(){let p=state.profile;let projects=[{title:'A better everyday tool',interest:'Design',detail:'Choose one small frustration and sketch a clearer way to handle it. Share the sketch and ask for one suggestion.',time:'1–2 hours',skill:'Problem framing'},{title:'Tiny data story',interest:'Technology',detail:'Find a public dataset you care about. Make one chart and explain what surprised you in a short paragraph.',time:'2 hours',skill:'Data literacy'},{title:'Community listening notes',interest:'Social impact',detail:'Talk with someone about a local challenge (with their consent). Summarize what you heard and one possible next question.',time:'1 hour',skill:'Research'},{title:'One-minute explainer',interest:'Writing',detail:'Explain an idea you care about in 150 words, then revise it after a reader tells you what was unclear.',time:'45 minutes',skill:'Communication'},{title:'Simple web page',interest:'Technology',detail:'Build a one-page site describing a project idea. It can be a no-code draft or a paper prototype.',time:'2–3 hours',skill:'Digital making'},{title:'Test a small business idea',interest:'Business',detail:'Describe who a service could help. Ask three people what they currently do and note patterns; don’t pitch or collect sensitive data.',time:'1–2 hours',skill:'Customer discovery'}];let relevant=projects.sort((a,b)=>(p.interests.includes(b.interest)?1:0)-(p.interests.includes(a.interest)?1:0));return `<div class="pagehead"><div><h2>Zero to potential</h2><p>Build experience progressively through small, real work. These starter challenges need no prior experience or credentials.</p></div><span class="pill">Start where you are</span></div><div class="callout">Your profile is not a gate. These activities are starting points, not proof that you already have a skill. Add the work to your profile only after you complete it.</div><div class="section-head"><h3>Starter projects for your interests</h3><span>Choose one to add to your roadmap</span></div><div class="pagegrid">${relevant.slice(0,4).map(x=>`<article class="card"><div class="card-title">${esc(x.title)} <span class="match">${esc(x.interest)}</span></div><p style="font-size:10px;line-height:1.55;margin:10px 0">${esc(x.detail)}</p><div class="opp-meta"><span>${esc(x.time)}</span><span>Builds: ${esc(x.skill)}</span></div><div class="op-actions"><button class="secondary" data-addproject="${esc(x.title)}" data-detail="${esc(x.detail)}">Add to roadmap</button><button class="subtle" data-markproject="${esc(x.title)}" data-detail="${esc(x.detail)}">I completed this</button></div></article>`).join('')}</div><div class="section-head"><h3>Your evidence so far</h3><span>Only completed work belongs here</span></div><article class="card">${p.projects.length?p.projects.map((x,i)=>`<div class="itemrow"><div><h4>${esc(x.title)}</h4><p>${esc(x.detail)}</p></div><button class="subtle" data-remove-project="${i}">Remove</button></div>`).join(''):'<div class="empty">Complete a starter project, then add it here as evidence.</div>'}</article>`}
function roadmapPage(){let items=state.roadmap,done=items.filter(x=>x.done).length,pct=items.length?Math.round(done/items.length*100):0;return `<div class="pagehead"><div><h2>Growth roadmap</h2><p>A flexible sequence of skills, projects, and opportunity actions. Mark steps complete as you make progress.</p></div><button class="secondary" data-action="addMilestone">+ Add milestone</button></div><article class="card"><div class="card-title">Your progress <span>${done} of ${items.length} complete</span></div><div class="goalbar"><span style="width:${pct}%"></span></div><div class="progressline"><span>Keep the pace realistic and adjust as you learn.</span><span>${pct}%</span></div></article><div class="section-head"><h3>Next steps</h3><span>Reorder and adjust milestones in your own way</span></div><div class="road-list">${items.length?items.map(x=>`<article class="road-full ${x.done?'done':''}"><div class="week">${esc(x.week)}</div><div><h4>${esc(x.title)}</h4><p>${esc(x.detail)}</p><div class="duration">${esc(x.duration)}</div></div><button class="${x.done?'secondary':'subtle'}" data-road="${x.id}">${x.done?'Completed ✓':'Mark done'}</button></article>`).join(''):'<div class="empty">Your roadmap is clear. Add a milestone or pick a project from Zero to Potential.</div>'}</div><div class="section-head"><h3>Suggested resources</h3><span>Generic resource types, not endorsements</span></div><div class="pagegrid"><div class="resource"><b>Learn by making</b>Try a free beginner tutorial in a tool connected to one of your interests, then create a small artifact of your own.</div><div class="resource"><b>Get feedback</b>Ask a teacher, peer, colleague, or community group one specific question about your project. Keep only feedback you find useful.</div></div>`}
function identityPage(){let p=state.profile;return `<div class="pagehead"><div><h2>Identity studio</h2><p>Turn your real experience into a clear resume or portfolio outline. MOSAIC only uses details you provide.</p></div><span class="pill">No invented claims</span></div><div class="callout">Drafts use your own profile information. Review every line before sharing. A blank section is better than a fabricated achievement.</div><div class="tabs"><button class="tab ${identityTab==='resume'?'active':''}" data-idtab="resume">Resume draft</button><button class="tab ${identityTab==='portfolio'?'active':''}" data-idtab="portfolio">Portfolio profile</button></div>${identityTab==='resume'?`<div class="pagegrid"><div class="stack"><article class="card"><div class="card-title">Details for your resume</div><div class="field"><label>Contact information (optional)</label><input id="contact" value="${esc(p.contact)}" placeholder="Email · phone · profile link"></div><div class="field"><label>Education</label><input id="education" value="${esc(p.education)}" placeholder="School / institution · programme · dates"></div><div class="field"><label>Achievements you can verify (one per line)</label><textarea id="achievements" placeholder="Only add real awards, results, or recognitions">${esc(p.achievements.join('\n'))}</textarea></div><div class="field"><label>Projects / experience details</label><p class="hint">These come from your profile. Add or edit them in Personal Profile.</p><div>${p.experiences.length?p.experiences.map(x=>`<div class="itemrow"><div><h4>${esc(x.title)}</h4><p>${esc(x.detail)}</p></div></div>`).join(''):'<div class="empty">Add a project, activity, or role in Personal Profile to include it here.</div>'}</div></div><button class="primary" data-action="generateResume">Generate resume draft</button></article></div><div class="stack"><article class="card"><div class="card-title">Your editable draft <div class="toolrow"><button class="subtle" data-action="copyResume">Copy</button><button class="secondary" data-action="downloadResume">Download .txt</button></div></div><textarea id="resumeDraft" class="resume-preview" placeholder="Choose Generate resume draft to prepare an editable draft.">${esc(state.identity?.resumeDraft||'')}</textarea><p class="hint">Generated only from details you entered. Edit the draft before using it.</p></article></div></div>`:`<div class="pagegrid"><article class="card"><div class="card-title">Profile summary</div><p style="font-size:11px;line-height:1.6">${esc(p.name)} is a ${esc(p.stage.toLowerCase())}${p.goal?` working towards ${esc(p.goal.toLowerCase())}`:''}.${p.interests.length?` Current interests include ${esc(p.interests.join(', '))}.`:''}</p><div class="subhead">Skills</div><div class="chips">${p.skills.map(s=>`<span class="chip evidence">${esc(s.name)}</span>`).join('')||'<span class="hint">No demonstrated skills added yet</span>'}</div><div class="subhead">Projects & experience</div>${p.experiences.map(x=>`<div class="itemrow"><div><h4>${esc(x.title)}</h4><p>${esc(x.detail)}</p></div></div>`).join('')||'<p class="hint">Your next small project can be your first portfolio item.</p>'}</article><article class="card"><div class="card-title">Portfolio intro · editable</div><div class="field"><label>Draft</label><textarea id="portfolioDraft" style="min-height:220px">${esc(state.identity?.portfolioDraft||portfolioText())}</textarea></div><button class="secondary" data-action="copyPortfolio">Copy profile intro</button><p class="hint">Use this as a starting point. Review and adjust it so it sounds like you.</p></article></div>`}`}
function portfolioText(){let p=state.profile;return `${p.name} · ${p.stage}\n${p.goal?`Working towards: ${p.goal}\n`:''}${p.interests.length?`Interests: ${p.interests.join(', ')}\n`:''}${p.skills.length?`Skills demonstrated: ${p.skills.map(x=>x.name).join(', ')}\n`:''}${p.experiences.length?`Selected work: ${p.experiences.map(x=>x.title).join(', ')}`:'Currently exploring and building practical experience.'}`}
function studentPage(){let p=state.profile;return `<div class="pagehead"><div><h2>Student studio</h2><p>Explore courses and organize application thinking around your own experiences and goals.</p></div><span class="pill">Student support</span></div><div class="callout">Course suggestions below are sample categories, not verified university or admissions information. Check official institution sources for current courses, requirements, and deadlines. Writing prompts help you brainstorm; they do not write personal claims for you.</div><div class="pagegrid" style="margin-top:12px"><article class="card"><div class="card-title">Course exploration</div><div class="field"><label>What would you like to explore?</label><select id="courseInterest"><option value="">Choose an area</option>${['Design','Technology','Business','Research','Social impact','Writing','Science','Climate','Health'].map(x=>`<option ${p.interests.includes(x)?'selected':''}>${x}</option>`).join('')}</select></div><div id="courseResults" class="list"></div></article><article class="card"><div class="card-title">Application story workshop</div><p class="hint">Start with a real moment or activity. MOSAIC will help you organize your thoughts into an outline, not invent an essay.</p><div class="field"><label>What experience or moment would you like to reflect on?</label><textarea id="storyInput" placeholder="A project, challenge, responsibility, question, or moment that mattered to you">${esc(state.student.story)}</textarea></div><div class="field"><label>What course or goal are you applying toward?</label><input id="studentGoal" value="${esc(state.student.course||p.goal)}" placeholder="Course / programme / goal"></div><div class="field"><label>What do you want the reader to understand about you?</label><input id="studentNotes" value="${esc(state.student.notes)}" placeholder="A value, interest, or quality you want to convey"></div><button class="primary" data-action="storyOutline">Create reflection prompts</button><div id="storyOutput" style="margin-top:12px"></div></article></div>`}
function renderCourses(){let box=$('#courseResults');if(!box)return;let area=$('#courseInterest').value;let data=area?{Design:['Communication design','Human-computer interaction','Industrial design'],Technology:['Computer science','Information technology','Digital product design'],Business:['Business administration','Economics','Entrepreneurship'],Research:['Research methods','Psychology','Environmental studies'],'Social impact':['Social work','Public policy','Development studies'],Writing:['Journalism','English','Media and communication'],Science:['Biology','Physics','Chemistry'],'Climate':['Environmental science','Climate policy','Sustainability studies'],Health:['Public health','Nutrition','Health sciences']}[area]||[]:[];box.innerHTML=data.length?`<p class="hint">Sample areas to explore under ${esc(area)}. Use these as search terms on official university websites.</p>${data.map(c=>`<article class="opcard"><h4>${esc(c)}</h4><p>Compare course content, entry criteria, costs, and location on official institution pages.</p><button class="subtle" data-addinterest="${esc(area)}">Keep ${esc(area)} in my interests</button></article>`).join('')}`:'<div class="empty">Choose an area to see sample course categories.</div>'}
function generateResume(){let p=state.profile;let lines=[p.name.toUpperCase(),p.contact||'[Add your contact information]','',p.goal?'PROFILE / OBJECTIVE':null,p.goal?`Interested in ${p.goal.toLowerCase()}. Focused on exploring ${p.interests.join(', ')||'new areas'} through practical work.`:null,p.goal?'':'',p.education?'EDUCATION':null,p.education||null,p.education?'':'',p.skills.length?'SKILLS':null,...p.skills.map(s=>`• ${s.name}${s.evidence?' — '+s.evidence:''}`),p.skills.length?'':'',p.experiences.length?'PROJECTS & EXPERIENCE':null,...p.experiences.flatMap(x=>[`${x.title}${x.org?' · '+x.org:''}`,x.detail]),p.experiences.length?'':'',p.achievements.length?'ACHIEVEMENTS':null,...p.achievements.map(x=>'• '+x)].filter(x=>x!==null);return lines.join('\n')}
function bindPage(){let v=$('#view');v.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{page=b.dataset.goto;render()});v.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));v.querySelectorAll('[data-road]').forEach(b=>b.onclick=()=>toggleRoad(b.dataset.road));v.querySelectorAll('[data-remove-skill]').forEach(b=>b.onclick=()=>{state.profile.skills.splice(+b.dataset.removeSkill,1);persist();render()});v.querySelectorAll('[data-remove-exp]').forEach(b=>b.onclick=()=>{state.profile.experiences.splice(+b.dataset.removeExp,1);persist();render()});v.querySelectorAll('[data-remove-project]').forEach(b=>b.onclick=()=>{state.profile.projects.splice(+b.dataset.removeProject,1);persist();render()});v.querySelectorAll('[data-opptab]').forEach(b=>b.onclick=()=>{oppTab=b.dataset.opptab;renderPage()});v.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let id=b.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];persist();renderPage()});['oppSearch','oppType','oppLevel','oppFormat'].forEach(id=>$('#'+id)?.addEventListener('input',renderOpps));v.querySelectorAll('[data-idtab]').forEach(b=>b.onclick=()=>{identityTab=b.dataset.idtab;renderPage()});$('#contact')?.addEventListener('input',e=>{state.profile.contact=e.target.value;persist()});$('#education')?.addEventListener('input',e=>{state.profile.education=e.target.value;persist()});$('#achievements')?.addEventListener('input',e=>{state.profile.achievements=e.target.value.split('\n').map(x=>x.trim()).filter(Boolean);persist()});$('#resumeDraft')?.addEventListener('input',e=>{state.identity.resumeDraft=e.target.value;persist()});$('#portfolioDraft')?.addEventListener('input',e=>{state.identity.portfolioDraft=e.target.value;persist()});v.querySelectorAll('[data-addproject]').forEach(b=>b.onclick=()=>{state.roadmap.push({id:'r'+Date.now(),week:'UP NEXT',title:b.dataset.addproject,detail:b.dataset.detail,duration:'Choose your own pace',done:false});persist();toast('Added to your roadmap');renderPage()});v.querySelectorAll('[data-markproject]').forEach(b=>b.onclick=()=>{state.profile.projects.push({title:b.dataset.markproject,detail:b.dataset.detail});persist();toast('Added to your profile as completed evidence');renderPage()});$('#courseInterest')?.addEventListener('change',renderCourses);if($('#courseInterest'))renderCourses();v.querySelectorAll('[data-addinterest]').forEach(b=>b.onclick=()=>{if(!state.profile.interests.includes(b.dataset.addinterest))state.profile.interests.push(b.dataset.addinterest);persist();toast('Interest added to your profile')});if($('#oppList'))renderOpps()}
function toggleRoad(id){let item=state.roadmap.find(x=>x.id===id);if(item)item.done=!item.done;persist();renderPage()}
function action(name){let p=state.profile;if(name==='editBasics'){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Edit your profile</h3><div class="field"><label>Name</label><input id="editName" value="${esc(p.name)}"></div><div class="field"><label>Current stage</label><select id="editStage">${['School student','College student','Working professional'].map(s=>`<option ${s===p.stage?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Current goal</label><input id="editGoal" value="${esc(p.goal)}"></div><div class="field"><label>Location</label><input id="editLocation" value="${esc(p.location)}"></div><div class="field"><label>Opportunity format</label><select id="editFormat">${['Any','Online','Hybrid','Offline'].map(s=>`<option ${s===p.format?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Education</label><input id="editEducation" value="${esc(p.education)}" placeholder="Institution, programme, dates"></div><button class="primary wide" onclick="saveBasics()">Save changes</button>`)}
else if(name==='editInterests'){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Choose your interests</h3><p>These help explain matches, but they aren’t claims about your skills.</p><div class="taglist" id="editInterestList">${INTERESTS.map(i=>`<button class="tag ${p.interests.includes(i)?'selected':''}" data-i="${i}">${i}</button>`).join('')}</div><button class="primary wide" style="margin-top:18px" onclick="saveInterests()">Save interests</button>`);$('#editInterestList').onclick=e=>{let b=e.target.closest('[data-i]');if(b)b.classList.toggle('selected')}}
else if(name==='addSkill'){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Add a demonstrated skill</h3><p>Only include a skill you can support with an example. You can add a self-reported skill with no certificate.</p><div class="field"><label>Skill</label><input id="skillName" placeholder="e.g. Figma, writing, organizing"></div><div class="field"><label>How have you used it?</label><textarea id="skillEvidence" placeholder="A project, activity, class, or situation"></textarea></div><button class="primary wide" onclick="saveSkill()">Add skill</button>`)}
else if(name==='addExperience'){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Add work or experience</h3><p>Include schoolwork, personal projects, volunteering, caring responsibilities, or paid work. Keep details truthful and specific.</p><div class="field"><label>Title or activity</label><input id="expTitle" placeholder="e.g. Class science project"></div><div class="field"><label>Organization (optional)</label><input id="expOrg" placeholder="School, group, or self-directed"></div><div class="field"><label>What did you do? (optional)</label><textarea id="expDetail" placeholder="Your role, contribution, or what you learned"></textarea></div><div class="field"><label>When? (optional)</label><input id="expDate" placeholder="e.g. 2025"></div><button class="primary wide" onclick="saveExperience()">Add to profile</button>`)}
else if(name==='confirmStrength'){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Add a strength you recognize</h3><p>These suggestions are inferred from your interests. Choose one only if it feels accurate to you.</p><div class="taglist" id="strengthChoices">${inferStrengths(p.interests).filter(x=>!p.strengths.includes(x)).map(x=>`<button class="tag" data-strength="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="field"><label>Or write your own self-reported strength</label><input id="customStrength" placeholder="A quality you recognize in yourself"></div><button class="primary wide" onclick="saveStrength()">Add strength</button>`);$('#strengthChoices').onclick=e=>{let b=e.target.closest('[data-strength]');if(b)b.classList.toggle('selected')}}
else if(name==='addMilestone'){openModal(`<button class="close" onclick="closeModal()">×</button><h3>Add a roadmap milestone</h3><div class="field"><label>Milestone</label><input id="mileTitle" placeholder="What would you like to do?"></div><div class="field"><label>Small next action</label><textarea id="mileDetail" placeholder="Make it specific and manageable"></textarea></div><div class="field"><label>When?</label><input id="mileWeek" placeholder="e.g. This week"></div><button class="primary wide" onclick="saveMilestone()">Add milestone</button>`)}
else if(name==='generateResume'){p.contact=$('#contact').value;p.education=$('#education').value;p.achievements=$('#achievements').value.split('\n').map(x=>x.trim()).filter(Boolean);state.identity.resumeDraft=generateResume();persist();$('#resumeDraft').value=state.identity.resumeDraft;toast('Resume draft created from your profile')}
else if(name==='copyResume'){copyText($('#resumeDraft').value)}else if(name==='downloadResume'){downloadText('mosaic-resume-draft.txt',$('#resumeDraft').value||generateResume())}
else if(name==='copyPortfolio'){copyText($('#portfolioDraft').value)}else if(name==='storyOutline'){state.student.story=$('#storyInput').value;state.student.course=$('#studentGoal').value;state.student.notes=$('#studentNotes').value;persist();let story=state.student.story, course=state.student.course, notes=state.student.notes;$('#storyOutput').innerHTML=story?`<div class="resource"><b>Reflection outline · ${esc(course||'your goal')}</b><ol><li>Describe the moment: what happened, and what was your role?</li><li>What did you notice, decide, or try? Include only details you remember.</li><li>What changed or what did you learn? What would you do differently?</li><li>${notes?`How does this connect to “${esc(notes)}” or your interest in ${esc(course||'this course')}?`:'How does this connect to the course or goal you named?'}</li><li>What would you like to explore next?</li></ol><p>Use specific facts you can stand behind. This is a planning outline, not a finished essay.</p></div>`:'<div class="callout">Add a real moment or experience first. It can be small: a question you pursued, a responsibility you took on, or something you learned by making or helping.</div>';}
else if(name==='clearProfile'){if(confirm('Reset your profile and start over? This removes this MOSAIC profile from this browser.')){state=null;localStorage.removeItem('mosaic_v1');render()}}
else if(name==='clearData'){if(confirm('Delete all MOSAIC data saved in this browser?')){state=null;localStorage.removeItem('mosaic_v1');render()}}
else if(name==='exportData'){downloadText('mosaic-profile.json',JSON.stringify(state,null,2),'application/json')}}
function saveBasics(){let p=state.profile;p.name=$('#editName').value.trim()||p.name;p.stage=$('#editStage').value;p.goal=$('#editGoal').value.trim();p.location=$('#editLocation').value.trim();p.format=$('#editFormat').value;p.education=$('#editEducation').value.trim();persist();closeModal();render()}
function saveInterests(){state.profile.interests=[...$('#editInterestList').querySelectorAll('.selected')].map(x=>x.dataset.i);state.profile.strengths=[];persist();closeModal();render()}
function saveSkill(){let name=$('#skillName').value.trim();if(!name){toast('Enter a skill first');return}state.profile.skills.push({name,evidence:$('#skillEvidence').value.trim()});persist();closeModal();render()}
function saveExperience(){let title=$('#expTitle').value.trim();if(!title){toast('Enter a title or activity first');return}state.profile.experiences.push({title,org:$('#expOrg').value.trim(),detail:$('#expDetail').value.trim(),date:$('#expDate').value.trim()});persist();closeModal();render()}
function saveStrength(){let selected=[...$('#strengthChoices').querySelectorAll('.selected')].map(x=>x.dataset.strength);let custom=$('#customStrength').value.trim();state.profile.strengths=[...new Set([...state.profile.strengths,...selected,...(custom?[custom]:[])])];persist();closeModal();render()}
function saveMilestone(){let title=$('#mileTitle').value.trim();if(!title){toast('Enter a milestone first');return}state.roadmap.push({id:'r'+Date.now(),week:$('#mileWeek').value.trim()||'UP NEXT',title,detail:$('#mileDetail').value.trim(),duration:'At your pace',done:false});persist();closeModal();render()}
function copyText(txt){if(!txt){toast('Nothing to copy yet');return}navigator.clipboard?.writeText(txt).then(()=>toast('Copied to clipboard')).catch(()=>{let t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Copied to clipboard')})}
function downloadText(name,txt,type='text/plain'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
